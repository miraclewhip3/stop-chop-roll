<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop Chop and Roll</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23151925'/><rect x='7' y='8' width='17' height='17' rx='4' fill='%23ebe6d9' transform='rotate(-12 15.5 16.5)'/><circle cx='12' cy='13' r='2' fill='%23151925'/><circle cx='19' cy='19' r='2' fill='%23151925'/><path d='M5 27 L27 5' stroke='%23e2654f' stroke-width='3.5' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#151925; --panel:#1e2434; --panel2:#272f45; --line:#39425c;
  --fg:#ebe6d9; --muted:#9ba4b9; --gold:#dba84a; --gold-dim:#8a6a2f;
  --blue:#5592e3; --red:#e2654f; --green:#5cbf7d; --violet:#a07ae0;
  --dmg:#ff8a73; --shd:#7fb2ff; --hea:#7be39a; --man:#c9a6ff; --blk:#7d869c;
  --display:"Alegreya Sans SC","Trebuchet MS",sans-serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.4;min-height:100vh}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
h2{font-size:1.5rem;color:var(--gold)}
h3{font-size:1.15rem}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}
button{font-family:var(--body)}
.btn{font:700 .95rem var(--body);background:var(--gold);color:#241a06;border:0;border-radius:7px;padding:.45rem .95rem;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn.sm{font-size:.8rem;padding:.25rem .6rem}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:7px;width:2.1rem;height:2.1rem;font-size:1rem;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input{font:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:.4rem .6rem}
.wrap{max-width:1060px;margin:0 auto;padding:12px 16px 40px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--panel2);color:var(--muted)}
.tag.caster{background:#3a2b5c;color:#e2d4ff}

/* faces */
.f{display:inline-flex;align-items:center;justify-content:center;gap:1px;min-width:1.9rem;height:1.6rem;padding:0 4px;border-radius:5px;background:#0f1320;border:1px solid var(--line);font-size:.8rem;font-weight:700;cursor:help}
.f b{font-family:var(--mono);font-size:.85rem}
.f-D{color:var(--dmg)}.f-S{color:var(--shd)}.f-H{color:var(--hea)}.f-M{color:var(--man)}.f-B{color:var(--blk)}
.f.up{outline:2px solid var(--gold)}
.faces{display:flex;gap:3px;flex-wrap:wrap}
.die{width:4.3rem;height:4.3rem;border-radius:12px;background:#f1ebdc;color:#222;display:flex;align-items:center;justify-content:center;gap:2px;font-size:1.5rem;font-weight:800;border:3px solid #cfc6b0;box-shadow:0 3px 0 #9b927c;cursor:default;user-select:none;position:relative;transition:transform .12s}
.die b{font-family:var(--mono);font-size:1.7rem}
.die.f-D{color:#c4361f}.die.f-S{color:#2862c4}.die.f-H{color:#1f8f44}.die.f-M{color:#7440c9}.die.f-B{color:#8c8578;font-size:2.4rem}
.die.mine{cursor:pointer}
.die.kept{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 3px 0 #9b927c;transform:translateY(-3px)}
.die.kept::after{content:"KEPT";position:absolute;bottom:-1.25rem;font-size:.6rem;letter-spacing:.1em;color:var(--gold)}
.die.sel{box-shadow:0 0 0 4px #fff,0 3px 0 #9b927c;transform:scale(1.06)}
.die.used{opacity:.55}
.die.empty{background:#252c40;border-color:var(--line);box-shadow:none;color:var(--muted);font-size:1rem}
.die.roll{animation:roll .45s ease-out}
@keyframes roll{0%{transform:rotate(-30deg) scale(.7)}60%{transform:rotate(12deg) scale(1.08)}100%{transform:none}}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0 12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.topbar .title{font-family:var(--display);font-size:1.2rem;color:var(--gold);display:flex;align-items:center;gap:8px}
.topbar .sp{flex:1}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;font-size:.85rem;white-space:nowrap}
.chip.theme{border-color:var(--gold-dim);color:var(--gold);cursor:help}

/* battle */
.side{display:grid;grid-template-columns:11rem 1fr;gap:12px;align-items:stretch}
.sidehead{display:flex;flex-direction:column;gap:8px}
.sidehead .nm{font-family:var(--display);font-size:1.2rem}
.lifebox{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;position:relative}
.lifebox .life{font-family:var(--mono);font-size:1.6rem;color:#ff9a9a;font-variant-numeric:tabular-nums}
.lifebox .sub{font-size:.75rem;color:var(--muted)}
.manabox{font-family:var(--mono);color:var(--man);font-size:1rem}
.party{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hero{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0;position:relative}
.hero .hh{display:flex;gap:6px;align-items:center;width:100%}
.hero .hh .ic{font-size:1.3rem}
.hero .hh b{font-family:var(--display);font-size:1.05rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .lv{font-size:.7rem;color:var(--gold)}
.hpbar{width:100%;height:1.05rem;background:#0f1320;border-radius:5px;position:relative;overflow:hidden;border:1px solid var(--line)}
.hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3d9a5c,#5cbf7d);transition:width .3s}
.hpbar span{position:relative;display:block;text-align:center;font:600 .72rem var(--mono);line-height:1rem}
.hero.dead{opacity:.45;filter:grayscale(.8)}
.hero.dead .die{visibility:hidden}
.tgtline{font-size:.78rem;min-height:1.1rem;color:var(--muted);text-align:center}
.badges{display:flex;gap:4px;min-height:1.3rem;flex-wrap:wrap;justify-content:center}
.bdg{font-size:.72rem;font-weight:700;padding:1px 6px;border-radius:4px;background:#0f1320;border:1px solid var(--line)}
.bdg.D{color:var(--dmg);border-color:#6b3329}.bdg.S{color:var(--shd)}.bdg.H{color:var(--hea)}
.spellrow{min-height:1.7rem;display:flex;align-items:center}
.spellbtn{font:700 .75rem var(--body);background:#2d2350;color:#e2d4ff;border:1px solid #5a4796;border-radius:6px;padding:.2rem .5rem;cursor:pointer}
.spellbtn.on{background:var(--violet);color:#160d2c}
.spellbtn:disabled{opacity:.4;cursor:default}
.spelltxt{font-size:.75rem;color:#cdbcff}
.itemchip{font-size:.75rem;color:var(--muted);min-height:1.1rem}
.tg-ok{border-color:var(--gold)!important;box-shadow:0 0 0 2px var(--gold-dim);cursor:crosshair}
.tg-ok:hover{background:#2c2a22}
.center{margin:12px 0;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.phase{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.phase span{font-size:.8rem;padding:.2rem .6rem;border-radius:999px;background:var(--panel2);color:var(--muted)}
.phase span.on{background:var(--gold);color:#241a06;font-weight:700}
.hint{font-size:.9rem;color:var(--muted);max-width:44rem;min-height:1.3rem}
.banner{background:#3a2c12;border:1px solid var(--gold-dim);color:#ffe6b0;padding:.35rem .8rem;border-radius:8px;font-size:.9rem}
.log{max-width:760px;margin:10px auto 0}
.log table{width:100%;border-collapse:collapse;font-size:.82rem}
.log td,.log th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left}
.log th{font-family:var(--display);color:var(--muted)}
.divider{border-top:1px dashed var(--line);margin:4px 0}
.float{position:fixed;pointer-events:none;font:800 1.4rem var(--mono);z-index:50;animation:floatup 1.1s ease-out forwards;text-shadow:0 2px 3px #000}
@keyframes floatup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-38px)}}

/* draft / rewards */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(12.5rem,1fr));gap:10px}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.tile .hh{display:flex;gap:6px;align-items:center}
.tile .hh .ic{font-size:1.4rem}
.tile .hh b{font-family:var(--display);font-size:1.1rem;flex:1}
.tile.taken{opacity:.45}
.tile .desc{font-size:.85rem;color:var(--muted);flex:1}
.tile .btn{align-self:flex-start}
.tile.picked{border-color:var(--gold)}
.themecard{background:linear-gradient(160deg,#3a2c12,#1e2434 70%);border:1px solid var(--gold-dim);border-radius:10px;padding:10px 14px;max-width:22rem}
.themecard small{display:block;color:var(--muted);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.themecard .t{font-family:var(--display);font-size:1.2rem;color:var(--gold)}
.order{display:flex;gap:4px;flex-wrap:wrap}
.order span{padding:2px 8px;border-radius:4px;font-size:.8rem;background:var(--panel2)}
.order .p0{background:#25406b}.order .p1{background:#6b2c25}.order .now{outline:2px solid var(--gold)}
.order .done{opacity:.5}
.stack{display:flex;flex-direction:column;gap:12px}
.slot{font-size:.8rem;padding:.25rem .55rem;border-radius:6px;border:1px dashed var(--line);background:#0f1320;cursor:pointer;color:var(--muted)}
.slot.full{border-style:solid;color:var(--fg)}
.slot.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-dim)}
.facepick .f{cursor:pointer}
.facepick .f:hover{outline:2px solid var(--gold)}

/* menu */
.menu{max-width:640px;margin:30px auto;display:flex;flex-direction:column;gap:16px;align-items:stretch}
.logo{display:flex;justify-content:center}
.menu .box{display:flex;flex-direction:column;gap:10px}
.code{font:700 2.6rem var(--mono);letter-spacing:.3em;color:var(--gold);text-align:center}
.err{color:var(--red)}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(5,7,12,.75);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 16px}
.overlay .box{max-width:760px;width:100%;display:flex;flex-direction:column;gap:10px}
.overlay table{border-collapse:collapse;font-size:.88rem}
.overlay td,.overlay th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
textarea{width:100%;min-height:6rem;font:.8rem var(--mono);background:#0f1320;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:8px}
#tip{position:fixed;z-index:60;background:#0b0e16;border:1px solid var(--gold-dim);color:var(--fg);font-size:.82rem;padding:6px 9px;border-radius:7px;max-width:18rem;pointer-events:none;display:none}
.dev{border:1px dashed #7a5;border-radius:8px;padding:4px 8px;font-size:.8rem}

@media (max-width:760px){
  .side{grid-template-columns:1fr}
  .party{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="tip"></div>
<div id="overlay" class="overlay hidden"></div>

<script>
'use strict';
// ================= DATA =================
const HEROES = {
  knight:    { name:'Knight',      icon:'🗡️', hp:8,  faces:['D3','D3','D2','S2','S2','B'] },
  archer:    { name:'Archer',      icon:'🏹', hp:5,  faces:['D3','D2','D2','D2','D1','B'] },
  paladin:   { name:'Paladin',     icon:'🛡️', hp:7,  faces:['S3','S2','H2','D2','D1','M1'], spell:'sanctuary' },
  ogre:      { name:'Ogre',        icon:'👹', hp:12, faces:['D4','D4','D3','B','B','B'] },
  cleric:    { name:'Cleric',      icon:'🕯️', hp:6,  faces:['H3','H2','H2','S1','M1','M1'], spell:'mend', caster:true },
  rogue:     { name:'Rogue',       icon:'🥷', hp:5,  faces:['D3','D3','D2','D1','M1','B'], spell:'backstab' },
  wizard:    { name:'Wizard',      icon:'🧙', hp:4,  faces:['M2','M2','D4','D3','M1','B'], spell:'firestorm', caster:true },
  bard:      { name:'Bard',        icon:'🎻', hp:5,  faces:['M2','M1','H1','S1','D1','B'], spell:'anthem', caster:true },
  monk:      { name:'Monk',        icon:'🥋', hp:6,  faces:['D2','D2','S2','H2','H1','B'] },
  necro:     { name:'Necromancer', icon:'💀', hp:5,  faces:['D2','D2','M2','M1','H1','B'], spell:'harvest', caster:true },
  druid:     { name:'Druid',       icon:'🌿', hp:6,  faces:['H2','S2','M2','M1','D2','B'], spell:'barkskin', caster:true },
  berserker: { name:'Berserker',   icon:'🪓', hp:6,  faces:['D5','D3','D3','D2','D1','B'] },
};
const SPELLS = {
  sanctuary:{ name:'Sanctuary',    cost:4, text:'Shield 2 on every ally hero.' },
  mend:     { name:'Mass Mend',    cost:3, text:'Heal 2 on every ally hero.' },
  firestorm:{ name:'Firestorm',    cost:4, text:'2 damage to every enemy hero.' },
  backstab: { name:'Backstab',     cost:2, text:'3 damage to the enemy hero with the lowest HP.' },
  anthem:   { name:'Anthem',       cost:3, text:'+1 to every other die you committed this turn.' },
  harvest:  { name:'Soul Harvest', cost:3, text:'3 damage to the enemy player.' },
  barkskin: { name:'Barkskin',     cost:3, text:'Shield 4 on your life.' },
  spark:    { name:'Spark',        cost:2, text:'2 damage to the enemy player.' },
};
const ITEMS = {
  whetstone:{ name:'Whetstone',    icon:'🔪', text:"This hero's ⚔ faces deal +1." },
  buckler:  { name:'Buckler',      icon:'🔰', text:"This hero's blank faces become 🛡2." },
  fang:     { name:'Vampire Fang', icon:'🦇', text:'When this hero deals damage, it heals 1 after damage.' },
  plate:    { name:'Plate Armor',  icon:'⛓️', text:'+3 max HP.' },
  crystal:  { name:'Mana Crystal', icon:'💎', text:"This hero's blank faces become ✦1." },
  herb:     { name:'Healing Herb', icon:'🌱', text:"This hero's ✚ faces heal +1." },
  tower:    { name:'Tower Shield', icon:'🧱', text:"This hero's 🛡 faces block +1." },
  scroll:   { name:'Spark Scroll', icon:'📜', text:'This hero can cast Spark (2✦): 2 damage to the enemy player.' },
};
const RELICS = {
  dice:  { name:'Lucky Dice',   icon:'🎲', text:'+1 reroll every turn.' },
  locket:{ name:'Heart Locket', icon:'💗', text:'+3 life every round.' },
  well:  { name:'Mana Well',    icon:'⛲', text:'Start every round with 2 ✦.' },
};
const THEMES = {
  glass: { name:'Glass Bones',  text:'Every hero has −2 max HP. ⚔ faces deal +1.' },
  thick: { name:'Thick Skin',   text:'Every hero has +3 max HP.' },
  arcane:{ name:'Arcane Surge', text:'Every spell costs 1 less ✦ (minimum 1).' },
  lucky: { name:'Lucky Day',    text:'3 rerolls each turn instead of 2.' },
  short: { name:'Short Fuse',   text:'Player life is 4 lower every round.' },
  sharp: { name:'Sharp Edges',  text:'Blank faces deal ⚔1 instead of nothing.' },
};
const FACE = {
  D:{ icon:'⚔', name:'Damage', text:n=>`Deal ${n} damage to an enemy hero or the enemy player.` },
  S:{ icon:'🛡', name:'Shield', text:n=>`Block ${n} damage to one of your heroes or your life this turn.` },
  H:{ icon:'✚', name:'Heal',   text:n=>`Restore ${n} HP to one ally hero (after damage).` },
  M:{ icon:'✦', name:'Mana',   text:n=>`Add ${n} mana to your party pool for this round.` },
  B:{ icon:'✕', name:'Blank',  text:()=>'Does nothing. A level-up turns it into ⚔1.' },
};
const BANDS = ['The Rusty Spoons','Grimtooth Gang','The Soggy Boots','Order of the Ladle','The Pickle Knights','Moonmoss Coven','The Bent Forks','Clan Cheddarheart'];
const RULES = { rounds:5, winTarget:3, rerolls:2, party:4 };
const PREFIX = 'cheezy-scr-';
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const DEV = new URLSearchParams(location.search).has('dev');

// ================= ENGINE =================
// Pure-ish game state machine: act(st, player, action). The host (or the solo page) runs it;
// guests only render the state they receive and send actions.
function rnd(st) { let t = (st.seed = (st.seed + 0x6D2B79F5) | 0); t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const ri = (st, n) => Math.floor(rnd(st) * n);
function shuffle(st, a) { for (let i = a.length - 1; i > 0; i--) { const j = ri(st, i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const parse = c => ({ t: c[0], n: +c.slice(1) || 0 });

function newHero(type) { return { type, bonus:0, lvl:1, faces: HEROES[type].faces.slice(), item:null, hp:0, dead:false }; }
function maxHp(st, h) {
  let m = HEROES[h.type].hp + h.bonus + (h.item === 'plate' ? 3 : 0);
  if (st.theme === 'glass') m -= 2; if (st.theme === 'thick') m += 3;
  return Math.max(1, m);
}
function eff(st, h, code) {   // effective face after items and theme
  let { t, n } = parse(code);
  if (t === 'B') {
    if (h.item === 'buckler') { t = 'S'; n = 2; }
    else if (h.item === 'crystal') { t = 'M'; n = 1; }
    else if (st.theme === 'sharp') { t = 'D'; n = 1; }
  }
  if (t === 'D') { if (h.item === 'whetstone') n++; if (st.theme === 'glass') n++; }
  if (t === 'H' && h.item === 'herb') n++;
  if (t === 'S' && h.item === 'tower') n++;
  return { t, n };
}
function spellsOf(h) { const s = []; if (HEROES[h.type].spell) s.push(HEROES[h.type].spell); if (h.item === 'scroll') s.push('spark'); return s; }
const spellCost = (st, s) => Math.max(1, SPELLS[s].cost - (st.theme === 'arcane' ? 1 : 0));
const lifeFor = (st, p) => Math.max(4, 10 + 2 * st.round - (st.theme === 'short' ? 4 : 0)) + (st.pl[p].relics.includes('locket') ? 3 : 0);
const alive = h => !h.dead && h.hp > 0;
const poss = n => n + (/s$/i.test(n) ? "'" : "'s");
const heroName = (st, p, h) => h < 0 ? st.pl[p].name : `${poss(st.pl[p].name)} ${HEROES[st.pl[p].party[h].type].name}`;

function newMatch(mode, names, seed) {
  const st = { v:1, mode, seed: seed | 0, round:0, score:[0,0], phase:'draft', theme:null, pool:[], taken:{}, order:[], oi:0,
    pl: names.map(n => ({ name:n, party:[], life:0, maxLife:0, mana:0, relics:[], bag:[], ready:false })),
    turn:0, first:0, active:0, step:'roll', rerolls:0, dice:[[],[]], cast:[[],[]], committed:[false,false],
    last:[], rewards:[], rorder:[], ri:0, chooser:null, starter:0, result:null, msg:'', rollN:0, resolveN:0, roundEnd:null };
  const tids = Object.keys(THEMES); st.theme = tids[ri(st, tids.length)];
  const types = shuffle(st, Object.keys(HEROES));
  if (mode === 'solo') { st.pool = types.slice(0, 8); st.order = [0,0,0,0]; st.starter = 1; }
  else { st.pool = types.slice(0, 10); const f = ri(st, 2); st.order = [f,1-f,1-f,f,f,1-f,1-f,f]; st.starter = 1 - f; }
  return st;
}

function genEnemy(st) {   // solo: a fresh rival party each round, upgraded as many times as you have been
  const types = shuffle(st, Object.keys(HEROES)).slice(0, RULES.party);
  const party = types.map(newHero);
  for (let u = 0; u < st.round - 1; u++) {
    const h = party[ri(st, party.length)];
    if (rnd(st) < 0.55 || h.item) {
      const bi = h.faces.indexOf('B');
      let fi = bi >= 0 ? bi : 0;
      if (bi < 0) h.faces.forEach((c, i) => { if (parse(c).n > parse(h.faces[fi]).n) fi = i; });

// A blank becomes ⚔1 (⚔2 under Sharp Edges, where blanks already deal 1); any other face gets +1.

function beginRound(st, replay) {

function rollFace(st, h) { return h.faces[ri(st, 6)]; }

function defaultTarget(st, p, h, t) {

function finishRolling(st, p) {

    d.tg = defaultTarget(st, p, i, e.t);

function act(st, p, a) {
  const P = st.pl[p];
  switch (a.t) {
    case 'pick': {
      if (st.phase !== 'draft' || st.order[st.oi] !== p) return 'Not your pick';
      if (!st.pool.includes(a.type) || st.taken[a.type] != null) return 'Hero not available';
      st.taken[a.type] = p; P.party.push(newHero(a.type)); st.oi++;

    }
    case 'keep': case 'reroll': case 'done': case 'target': case 'cast': case 'commit': {

function resolve(st) {

  st.dice = [[],[]]; st.cast = [[],[]]; st.committed = [false,false];

function endRound(st, lost) {

// ================= AI =================
function faceScore(st, p, h, code) {

function threat(st, p, h) { const x = st.pl[p].party[h]; return x.faces.reduce((s, c) => s + faceScore(st, p, h, c), 0) / 6; }

function aiDraftPick(st, p) {

    if (s > bs) { bs = s; best = t; }

}

function aiPlan(st, p) {

function aiNext(st, p) {

    for (const c of plan.casts) if (!st.cast[p].some(x => x.h === c.h && x.s === c.s) && st.pl[p].mana >= spellCost(st, c.s)) return { t:'cast', h: c.h, s: c.s };

}

// ================= AUDIO =================
let actx = null, master = null, musicGain = null;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
let muted = store.get('scr-mute') === '1', musicOn = store.get('scr-music') !== '0';
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
    master = actx.createGain(); master.connect(actx.destination); musicGain = actx.createGain(); musicGain.connect(master); applyVol(); }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function applyVol() { if (!master) return; master.gain.value = muted ? 0 : 0.8; musicGain.gain.value = musicOn ? 0.18 : 0; }
function tone(f, d, type = 'sine', vol = .15, slide = 0, delay = 0, dest) {
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(dest || master); o.start(t); o.stop(t + d + .02);
}

  const a = ac(); if (!a || muted) return;

const sfx = {
  roll() { for (let i = 0; i < 5; i++) noise(.04, .25, 2200 + Math.random() * 1500, i * .05 + Math.random() * .02); },
  click() { tone(660, .05, 'square', .05); },
  hit() { tone(140, .18, 'sawtooth', .14, -80); noise(.08, .2, 600); },
  shield() { tone(880, .12, 'triangle', .08); tone(1320, .15, 'triangle', .05, 0, .03); },
  heal() { tone(520, .15, 'sine', .1, 200); tone(780, .2, 'sine', .07, 200, .08); },
  mana() { [988, 1319, 1568].forEach((f, i) => tone(f, .12, 'sine', .06, 0, i * .05)); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, 'triangle', .12, 0, i * .12)); },
  lose() { [392, 349, 311, 262].forEach((f, i) => tone(f, .3, 'triangle', .12, 0, i * .15)); },
  pick() { tone(440, .08, 'triangle', .1); tone(660, .1, 'triangle', .08, 0, .06); },
  join() { tone(600, .1, 'sine', .12); tone(900, .14, 'sine', .1, 0, .1); },

// Gentle tavern loop: plucked chords on a 2-second bar, scheduled ahead.
const PROG = [[220, 277, 330], [196, 247, 294], [175, 220, 262], [196, 247, 294]];
let musicT = 0, musicBar = 0;
setInterval(() => {
  if (!actx || muted || !musicOn) return;
  if (musicT < actx.currentTime) musicT = actx.currentTime + .05;
  while (musicT < actx.currentTime + .6) {
    const ch = PROG[musicBar % PROG.length];
    [0, 1, 2, 1, 2, 1, 0, 2].forEach((ni, k) => tone(ch[ni] * (k === 4 ? 2 : 1), .5, 'triangle', .22, 0, musicT - actx.currentTime + k * .25, musicGain));
    tone(ch[0] / 2, 1.8, 'sine', .25, 0, musicT - actx.currentTime, musicGain);
    musicT += 2; musicBar++;

}, 300);

// ================= APP STATE =================
let st = null, me = 0, screen = 'menu', aiTimer = null;
const ui = { sel: null, pend: null, swapSel: null, err: '', joinCode: '' };
const net = { peer: null, role: null, code: '', conn: null };
const $ = id => document.getElementById(id);

function dispatch(a) {
  ac();
  if (net.role === 'client') { if (net.conn && net.conn.open) net.conn.send({ t:'act', a }); return; }
  if (!st) return;
  const err = act(st, me, a);
  if (err) { ui.err = err; render(); return; }
  ui.err = '';

}

function saveSolo() { if (st && st.mode === 'solo') store.set(SAVE_KEY, JSON.stringify(st)); }
function exportSave() { const s = store.get(SAVE_KEY); return s ? 'SCR1:' + btoa(unescape(encodeURIComponent(s))) : ''; }
function importSave(txt) {

// ================= NETWORK =================
function randCode() { let c = ''; for (let i = 0; i < 4; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return c; }
function publicState() { const { seed, snap, ...rest } = st; return rest; }
function sendState() { if (net.conn && net.conn.open) net.conn.send({ t:'state', s: publicState() }); }
function startHost(tries = 0) {
  if (!window.Peer) { ui.err = 'Could not load the PeerJS library. Check your internet connection.'; render(); return; }
  const code = randCode();
  net.myName = myName();
  screen = 'lobby'; ui.err = ''; ui.lobbyMsg = 'Contacting the PeerJS broker…'; render();
  const peer = new Peer(PREFIX + code, { debug: 1 });
  net.peer = peer;
  peer.on('open', () => { net.role = 'host'; net.code = code; ui.lobbyMsg = 'Waiting for a friend to join…'; render(); });
  peer.on('connection', conn => {
    conn.on('open', () => { if (net.conn && net.conn.open) { conn.send({ t:'full' }); setTimeout(() => conn.close(), 300); return; } net.conn = conn; });
    conn.on('data', d => hostOnData(conn, d));
    conn.on('close', () => { if (net.conn === conn) endSession('Your friend left the game.'); });
  });
  peer.on('error', e => {
    if (net.peer !== peer) return;
    if (e.type === 'unavailable-id' && tries < 5) { peer.destroy(); startHost(tries + 1); return; }
    netError(e);
  });
  peer.on('disconnected', () => { if (net.peer === peer && net.role === 'host') peer.reconnect(); });
}
function hostOnData(conn, d) {
  if (conn !== net.conn) return;
  if (d.t === 'hello') {
    st = newMatch('mp', [net.myName || myName(), String(d.name || 'Friend').slice(0, 14)], (Math.random() * 2 ** 31) | 0);
    me = 0; screen = 'game'; sfx.join(); afterChange();
  } else if (d.t === 'act' && st) {
    const err = act(st, 1, d.a);
    if (err) { conn.send({ t:'err', msg: err }); return; }
    afterChange();
  } else if (d.t === 'rematch' && st && st.phase === 'over') hostRematch();
}
function hostRematch() { st = newMatch('mp', [st.pl[0].name, st.pl[1].name], (Math.random() * 2 ** 31) | 0); afterChange(); }
function startJoin(code) {
  code = (code || '').trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(code)) { ui.err = 'Enter the 4-letter room code.'; render(); return; }
  if (!window.Peer) { ui.err = 'Could not load the PeerJS library. Check your internet connection.'; render(); return; }
  screen = 'lobby'; ui.err = ''; ui.lobbyMsg = 'Contacting the PeerJS broker…'; render();
  const peer = new Peer({ debug: 1 });
  net.peer = peer;
  peer.on('open', () => {
    ui.lobbyMsg = `Connecting to room ${code}…`; render();
    const conn = peer.connect(PREFIX + code, { serialization:'json', reliable:true });
    net.conn = conn; net.code = code;
    net.joinTimer = setTimeout(() => { if (net.peer === peer && !conn.open) netError({ type:'timeout', message:'Could not reach the host. Their network (or yours) may block direct connections.' }); }, 15000);
    conn.on('open', () => { clearTimeout(net.joinTimer); net.role = 'client'; me = 1; conn.send({ t:'hello', name: myName() }); ui.lobbyMsg = 'Connected. Waiting for the host…'; render(); });
    conn.on('data', d => {
      if (d.t === 'state') { const first = !st; st = d.s; screen = 'game'; ui.err = ''; if (first) sfx.join(); render(); }
      else if (d.t === 'full') endSession('That room already has two players.');
      else if (d.t === 'err') { ui.err = d.msg; render(); }
    });
    conn.on('close', () => { if (net.peer === peer) endSession('The host left, so the game ended.'); });

function previewMap() {   // planned shields/damage/heals per target from every die with a target
  const m = {}, K = (p, h) => p + ':' + h, add = (k, t, n) => { m[k] = m[k] || { D:0, S:0, H:0 }; m[k][t] += n; };

    const o = 1 - p;
    st.cast[p].forEach(c => {

      if (c.s === 'harvest') add(K(o, -1), 'D', 3);
      if (c.s === 'spark') add(K(o, -1), 'D', 2);

      if (c.s === 'barkskin') add(K(p, -1), 'S', 4);

// ================= SCREENS =================
function render() {
  const app = $('app');
  if (screen === 'menu') app.innerHTML = menuHtml();
  else if (screen === 'lobby') app.innerHTML = lobbyHtml();
  else if (st) {
    const body = { draft: draftHtml, battle: battleHtml, reward: rewardHtml, prep: prepHtml, over: overHtml }[st.phase]();
    app.innerHTML = topbar() + (ui.err ? `<div class="banner err" style="margin-bottom:8px">${esc(ui.err)}</div>` : '') + body;
  }
  postRender();
}

function postRender() {
  if (!st || screen !== 'game') { renderCache.vals = {}; renderCache.sig = null; return; }
  // sounds from state changes (works the same for host, guest and solo)
  const sig = { rollN: st.rollN, resolveN: st.resolveN, phase: st.phase };
  const prev = renderCache.sig;
  if (prev) {
    if (sig.rollN !== prev.rollN) sfx.roll();
    if (sig.resolveN !== prev.resolveN) {
      const kinds = new Set(st.last.map(l => l.kind));
      if (kinds.has('S')) sfx.shield(); if (kinds.has('D')) setTimeout(sfx.hit, 120); if (kinds.has('H')) setTimeout(sfx.heal, 300);
    }
    if (sig.phase !== prev.phase && sig.phase === 'over') (st.result === 'won' || st.result === me) ? sfx.win() : sfx.lose();
    else if (sig.phase !== prev.phase && sig.phase === 'reward') sfx.win();
  }
  renderCache.sig = sig;
  Object.assign(renderCache.roll, renderCache.rollNext);
  // floating numbers for HP / life changes
  const vals = {};
  st.pl.forEach((P, p) => { vals[p + ':L'] = P.life; P.party.forEach((x, h) => vals[p + ':' + h] = x.hp); });
  if (st.phase === 'battle' || st.phase === 'over' || st.phase === 'reward') {
    for (const k in vals) {
      const old = renderCache.vals[k];
      if (old == null || old === vals[k] || st.phase === 'battle' && st.turn === 1 && !st.last.length) continue;
      const el = document.querySelector(`[data-key="${k}"]`); if (!el) continue;
      const r = el.getBoundingClientRect(), f = document.createElement('div'), dv = vals[k] - old;
      f.className = 'float'; f.textContent = (dv > 0 ? '+' : '') + dv; f.style.color = dv > 0 ? 'var(--hea)' : 'var(--dmg)';
      f.style.left = (r.left + r.width / 2 - 14) + 'px'; f.style.top = (r.top + 30) + 'px';
      document.body.appendChild(f); setTimeout(() => f.remove(), 1200);
    }
  }
  renderCache.vals = vals;
}

function menuHtml() {
  const hasSave = !!store.get(SAVE_KEY);

document.addEventListener('click', e => {
  const el = e.target.closest('[data-ui],[data-pick],[data-die],[data-cast],[data-tp],[data-take],[data-lvl],[data-equip],[data-slot],[data-ready],[data-dev]');
  if (!el) return;
  ac();
  const d = el.dataset;
  if (d.ui) return uiAction(d.ui);
  if (d.dev) {
    if (d.dev === 'mana') st.pl[me].mana += 5;
    else endRound(st, d.dev === 'win' ? [me === 1, me === 0] : [me === 0, me === 1]);
    return afterChange();
  }
  if (d.pick) { sfx.pick(); return dispatch({ t:'pick', type: d.pick }); }
  if (d.die != null && +d.p === me && st.phase === 'battle' && st.active === me) {
    if (st.step === 'roll') { sfx.click(); return dispatch({ t:'keep', i: +d.die }); }
    ui.sel = ui.sel === +d.die ? null : +d.die; return render();
  }
  if (d.cast != null) { sfx.mana(); return dispatch({ t:'cast', h: +d.cast, s: d.s }); }
  const card = e.target.closest('[data-tp]');   // a click anywhere on a hero card or life box can target it
  if (card && ui.sel != null && canTarget(+card.dataset.tp, +card.dataset.th)) {
    const i = ui.sel; ui.sel = null; sfx.click();
    return dispatch({ t:'target', i, tg: { p: +card.dataset.tp, h: +card.dataset.th } });
  }
  if (d.take != null) {
    const r = st.rewards[+d.take];
    if (r.k === 'relic') { sfx.pick(); return dispatch({ t:'take', i: +d.take }); }
    ui.pend = +d.take; return render();
  }
  if (d.lvl != null) { const i = ui.pend; ui.pend = null; sfx.pick(); return dispatch({ t:'take', i, h: +d.lvl, f: +d.f }); }
  if (d.equip != null) { const i = ui.pend; ui.pend = null; sfx.pick(); return dispatch({ t:'take', i, h: +d.equip }); }
  if (d.slot) {
    if (ui.swapSel == null) { ui.swapSel = d.slot; return render(); }
    const a = ui.swapSel; ui.swapSel = null;
    if (a === d.slot) return render();
    sfx.click(); return dispatch({ t:'swap', a, b: d.slot });
  }
  if (d.ready != null) { const s = +d.ready; return dispatch({ t:'ready', starter: s >= 0 ? s : undefined }); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'nameIn') store.set('scr-name', e.target.value.trim().slice(0, 14));
  if (e.target.id === 'codeIn') ui.joinCode = e.target.value.toUpperCase();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('overlay').classList.add('hidden'); if (ui.sel != null) { ui.sel = null; render(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.die.mine')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.id === 'codeIn') uiAction('join');
});
function uiAction(k) {
  switch (k) {
    case 'solo':
      teardown(); st = newMatch('solo', [myName(), 'Rivals'], (Math.random() * 2 ** 31) | 0); st.bandOff = ri(st, BANDS.length);
      me = 0; screen = 'game'; ui.err = ''; renderCache.sig = null; afterChange(); break;
    case 'continue': try { st = JSON.parse(store.get(SAVE_KEY)); me = 0; screen = 'game'; renderCache.sig = null; afterChange(); } catch { ui.err = 'Could not load the save.'; render(); } break;
    case 'export': showText('Export save', exportSave()); break;
    case 'import': showText('Paste a save', '', true); break;
    case 'importok': try { importSave($('saveTxt').value); $('overlay').classList.add('hidden'); render(); } catch (err) { $('saveErr').textContent = err.message; } break;
    case 'host': ui.joinCode = ''; startHost(); break;
    case 'join': startJoin(ui.joinCode || ($('codeIn') && $('codeIn').value)); break;
    case 'leave':
      if (st && st.mode === 'solo') saveSolo();
      if (net.role === 'host' || net.role === 'client' || net.peer) endSession('');
      else { clearTimeout(aiTimer); st = null; screen = 'menu'; ui.err = ''; render(); }
      break;
    case 'help': showHelp(); break;
    case 'closehelp': $('overlay').classList.add('hidden'); break;
    case 'mute': muted = !muted; store.set('scr-mute', muted ? '1' : '0'); applyVol(); render(); break;
    case 'music': musicOn = !musicOn; store.set('scr-music', musicOn ? '1' : '0'); applyVol(); render(); break;
    case 'reroll': dispatch({ t:'reroll' }); break;
    case 'done': dispatch({ t:'done' }); break;
    case 'commit': ui.sel = null; dispatch({ t:'commit' }); break;
    case 'desel': ui.sel = null; render(); break;
    case 'unpend': ui.pend = null; render(); break;
    case 'retry': {
      const s = JSON.parse(st.snap); s.snap = st.snap; s.seed = (Math.random() * 2 ** 31) | 0;
      st = s; startTurn(st, st.first); renderCache.sig = null; afterChange(); break;
    }
    case 'rematch':
      if (net.role === 'host') hostRematch();
      else if (net.conn && net.conn.open) { net.conn.send({ t:'rematch' }); ui.err = 'Asked the host for a rematch.'; render(); }
      break;
  }
}

// tooltips
const tipEl = $('tip');
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tipEl.style.display = 'none'; return; }
  tipEl.textContent = t.dataset.tip; tipEl.style.display = 'block';
});
document.addEventListener('mousemove', e => {
  if (tipEl.style.display !== 'block') return;
  const x = Math.min(e.clientX + 14, innerWidth - tipEl.offsetWidth - 8), y = e.clientY + 18 + tipEl.offsetHeight > innerHeight ? e.clientY - tipEl.offsetHeight - 10 : e.clientY + 18;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
});
document.addEventListener('focusin', e => {
  const t = e.target.closest('[data-tip]'); if (!t) return;
  const r = t.getBoundingClientRect(); tipEl.textContent = t.dataset.tip; tipEl.style.display = 'block';
  tipEl.style.left = Math.min(r.left, innerWidth - tipEl.offsetWidth - 8) + 'px'; tipEl.style.top = (r.bottom + 6) + 'px';
});
document.addEventListener('focusout', () => tipEl.style.display = 'none');

// expose for testing / playtest harness
window.SCR = { get st() { return st; }, act, aiNext, newMatch, beginRound, dispatch, uiAction, RULES };
render();
</script>
